[package]
name = "zharp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Zharp <support@zharp.io>"]
description = "Zharp Application Monitoring for Rust: errors and panics with their stacks, traces, failed queries and logs, over OpenTelemetry."
license = "MIT"
repository = "https://github.com/zharp-io/zharp-rust-lib"
homepage = "https://zharp.io/docs/sdks/rust"
documentation = "https://docs.rs/zharp"
readme = "README.md"
keywords = ["monitoring", "opentelemetry", "tracing", "errors", "apm"]
categories = ["development-tools::debugging", "development-tools::profiling", "web-programming::http-server"]
include = ["src/**/*.rs", "examples/**/*.rs", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["sdk"]
# Everything but the build.rs helper (zharp::build). A build-dependency turns it off:
# [build-dependencies] zharp = { version = "0.1", default-features = false }
sdk = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-appender-tracing",
    "dep:tracing",
    "dep:tracing-core",
    "dep:tracing-subscriber",
    "dep:tracing-opentelemetry",
]
# A layer for any Tower service: Axum, tonic, Poem, Salvo, hyper.
tower = ["sdk", "dep:tower-layer", "dep:tower-service", "dep:http", "dep:opentelemetry-http", "dep:pin-project-lite"]
# Axum: the Tower layer with route names from MatchedPath, and Reported<E>.
axum = ["tower", "dep:axum"]
actix = ["sdk", "dep:actix-web", "dep:pin-project-lite"]
sqlx = ["sdk", "dep:sqlx-core"]
reqwest = ["sdk", "dep:reqwest", "dep:reqwest-middleware", "dep:async-trait", "dep:http", "dep:opentelemetry-http"]
anyhow = ["sdk", "dep:anyhow"]

[dependencies]
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "logs"], optional = true }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "logs"], optional = true }
# OTLP over HTTP/protobuf with a blocking client on the processors' own threads: no Tokio needed.
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "logs", "http-proto", "reqwest-blocking-client", "reqwest-rustls", "gzip-http"], optional = true }
opentelemetry-appender-tracing = { version = "0.33", default-features = false, optional = true }
opentelemetry-http = { version = "0.33", default-features = false, optional = true }
tracing = { version = "0.1.41", default-features = false, features = ["std"], optional = true }
tracing-core = { version = "0.1.33", optional = true }
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["std", "fmt", "ansi", "registry", "env-filter", "tracing-log", "smallvec"], optional = true }
tracing-opentelemetry = { version = "0.34", default-features = false, optional = true }

tower-layer = { version = "0.3", optional = true }
tower-service = { version = "0.3", optional = true }
http = { version = "1", optional = true }
pin-project-lite = { version = "0.2", optional = true }
axum = { version = "0.8", default-features = false, features = ["matched-path", "tokio"], optional = true }
actix-web = { version = "4", default-features = false, optional = true }
sqlx-core = { version = "0.9", default-features = false, optional = true }
reqwest = { version = "0.13", default-features = false, optional = true }
reqwest-middleware = { version = "0.5", optional = true }
async-trait = { version = "0.1", optional = true }
anyhow = { version = "1.0.80", optional = true }

[dev-dependencies]
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "logs", "testing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "macros"] }
actix-web = { version = "4", default-features = false, features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
anyhow = "1.0.80"
thiserror = "2"

[[example]]
name = "axum"
required-features = ["axum", "reqwest"]

[[example]]
name = "actix"
required-features = ["actix"]

[[example]]
name = "cli"
required-features = ["anyhow"]
